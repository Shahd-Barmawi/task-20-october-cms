description = "Main website layout"
==
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <title>{{ this.page.title }}</title>

        {% if this.page.meta_description %}
            <meta
                name="description"
                content="{{ this.page.meta_description }}"
            />
        {% endif %}

        <link
            rel="stylesheet"
            href="{{ 'assets/css/style.css'|theme }}"
        />

        {% styles %}
    </head>

    <body>
        {% partial 'header' %}

        <main>
            {% page %}
        </main>

        {% partial 'footer' %}

        {% framework extras %}
        {% scripts %}
    </body>
</html>
