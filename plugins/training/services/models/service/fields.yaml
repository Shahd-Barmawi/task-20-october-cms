fields:
    title:
        label: Title
        type: text
        span: full
        required: true

    short_description:
        label: Short Description
        type: textarea
        size: small
        span: full

    content:
        label: Detailed Description
        type: textarea
        size: large
        span: full

    category:
        label: Category
        type: relation
        nameFrom: name
        span: left
        emptyOption: Select a category

    is_active:
        label: Active
        type: switch
        default: true
        span: right

    display_order:
        label: Display Order
        type: number
        default: 0
        span: left
        required: true