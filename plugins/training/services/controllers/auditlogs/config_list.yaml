# ===================================
#  Audit Log List Behavior Config
# ===================================

list: $/training/services/models/auditlog/columns.yaml

modelClass: Training\Services\Models\AuditLog

title: Audit Log

# Open a read-only details/preview page
recordUrl: training/services/auditlogs/preview/:id

noRecordsMessage: No audit log entries found.

recordsPerPage: 20

showPageNumbers: true

showSetup: true

showSorting: true

defaultSort:
    column: created_at
    direction: desc

# Audit records must not be bulk edited/deleted
showCheckboxes: false

toolbar:
    search:
        prompt: Search audit logs...