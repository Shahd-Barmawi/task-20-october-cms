# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Dashboard

# Model Form Field configuration
form: $/training/services/models/dashboard/fields.yaml

# Model Class name
modelClass: Training\Services\Models\Dashboard

# Default redirect location
defaultRedirect: training/services/dashboard

# Create page
create:
    title: backend::lang.form.create_title
    redirect: training/services/dashboard/update/:id
    redirectClose: training/services/dashboard

# Update page
update:
    title: backend::lang.form.update_title
    redirect: training/services/dashboard
    redirectClose: training/services/dashboard

# Preview page
preview:
    title: backend::lang.form.preview_title
